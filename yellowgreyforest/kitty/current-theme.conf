# vim:ft=kitty

## name: Olive Field Dark

## license: MIT

## blurb: deep olive gold - black

#: Scroll

touch_scroll_multiplier 3
touch_momentum_scroll 1

#: Cursor

cursor_shape beam
cursor_beam_thickness 1
cursor_blink_interval 0.5

#: The basic colors

foreground #F2F1E8
background #000000
selection_foreground #FFFFFF
selection_background #353208
background_opacity 0.6

#: Cursor colors

cursor #8D8414
cursor_text_color #F2F1E8

#: URL underline color when hovering with mouse

url_color #8D8414

#: kitty window border colors and terminal bell colors

active_border_color #8D8414
inactive_border_color #353208
bell_border_color #8D8414
visual_bell_color none

#: OS Window titlebar colors

wayland_titlebar_color #171605
macos_titlebar_color #171605

#: Tab bar colors

active_tab_foreground #FFFFFF
active_tab_background #353208
inactive_tab_foreground #8F8D7A
inactive_tab_background #171605
tab_bar_background #0A0A06
tab_bar_margin_color none

#: Colors for marks

mark1_foreground #0A0A05
mark1_background #8D8414
mark2_foreground #0A0A05
mark2_background #8D8414
mark3_foreground #0A0A05
mark3_background #8D8414

#: The basic 16 colors

#: black

color0 #B1AA5A
color8 #B1AA5A

#: red

color1 #8D8414
color9 #8D8414

#: green

color2 #8D8414
color10 #8D8414

#: yellow

color3 #8D8414
color11 #8D8414

#: blue

color4 #8D8414
color12 #8D8414

#: magenta

color5 #8D8414
color13 #8D8414

#: cyan

color6 #8D8414
color14 #8D8414

#: white

color7 #F2F1E8
color15 #FFFFFF