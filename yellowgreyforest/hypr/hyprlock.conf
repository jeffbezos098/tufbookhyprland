background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 3
}

input-field {
    monitor =
    size = 150, 50
    outline_thickness = 1

    dots_size = 0.15
    dots_spacing = 0.8

    outer_color = rgba(21, 21, 24, 0.90)
    inner_color = rgba(15, 15, 16, 0.90)

    font_color = rgb(141, 132, 20)

    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"

    color = rgb(141, 132, 20)

    font_size = 48

    position = 0, 75
    halign = center
    valign = center
}