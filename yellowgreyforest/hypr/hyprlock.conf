background {
    monitor =
    path = /home/hypr/Pictures/Wallpapers/gruvbox_forest-4.png
    fit_mode = cover


    blur_passes = 3
    blur_size = 3
}

input-field {
    monitor =
    size = 85, 35
    outline_thickness = 1

    dots_size = 0.20
    dots_spacing = 0.8

    outer_color = rgba(35, 35, 35, 0.0)
    inner_color = rgba(36, 36, 36, 0.0)

    font_color = rgb(141, 132, 20)

    position = 0, -15
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"

    color = rgb(141, 132, 20)
    
    font_size = 36
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 25
    halign = center
    valign = center
}