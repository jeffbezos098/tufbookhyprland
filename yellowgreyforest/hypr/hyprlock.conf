background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 2
}

input-field {
    monitor =
    size = 150, 50
    outline_thickness = 1

    dots_size = 0.15
    dots_spacing = 0.8

    outer_color = rgb(242424)
    inner_color = rgb(242424)

    font_color = rgb(8D8414)

    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"

    color = rgb(8D8414)

    font_size = 48

    position = 0, 75
    halign = center
    valign = center
}