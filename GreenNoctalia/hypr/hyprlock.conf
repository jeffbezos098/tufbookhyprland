background {
monitor =
path = screenshot
fit_mode = 


blur_passes = 3
blur_size = 3


}

input-field {
monitor =
size = 85, 35
outline_thickness = 1


dots_size = 0.20
dots_spacing = 0.8

outer_color = rgba(8, 21, 18, 0.0)
inner_color = rgba(15, 37, 31, 0.0)

font_color = rgb(30, 145, 119)

position = 0, -15
halign = center
valign = center


}

label {
monitor =
text = cmd[update:1000] echo "$(date +"%I:%M")"


color = rgb(30, 145, 119)

font_size = 36
font_family = JetBrainsMono Nerd Font Propo

position = 0, 25
halign = center
valign = center


}
