```ini
background {

    monitor =
    path = screenshot
    fit_mode = 

    blur_passes = 3
    blur_size = 3

}

input-field {

    monitor =
    size = 85, 35
    outline_thickness = 1

    dots_size = 0.2
    dots_spacing = 0.9

    outer_color = rgba(26, 127, 103, 0.0)
    inner_color = rgba(15, 37, 31, 0.0)

    font_color = rgba(136, 136, 136, 0.5)

    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)

    position = 0, -15
    halign = center
    valign = center
}

label {

    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"

    color = rgba(136, 136, 136, 0.5)

    font_size = 36
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, 25
    halign = center
    valign = center
}
```
